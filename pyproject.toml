[project]
name = "chopf"
dynamic = ["version"]
description = "A Kubernetes container runtime implementation for Python."
readme = "README.md"
authors = [
    { name = "Steven Armstrong", email = "steven@armstrong.cc" }
]
requires-python = ">= 3.12"
dependencies = [
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0",
    "typer-slim>=0.15.1",
    "anyio>=4.16.0",
    "lightkube==1.0.2",
    "lightkube-models>=1.32.0.8",
    "httpx2>=0.28.1",
    "structlog>=25.4.0",
]

[project.scripts]
chopf = 'chopf.cli:app'

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "pytest>=9.0.0",
    "ruff>=0.12.1",
]

[tool.ruff.format]
quote-style = "single"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/chopf"]
